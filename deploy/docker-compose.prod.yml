services:
  postgres:
    image: postgres:17-alpine
    env_file: ${ENV_FILE:-.env.production}
    volumes: [maktaba_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: {context: .., dockerfile: apps/api/Dockerfile}
    env_file: ${ENV_FILE:-.env.production}
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes: [maktaba_backups:/app/backups]
    restart: unless-stopped
  web:
    build: {context: .., dockerfile: apps/web/Dockerfile}
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on: {api: {condition: service_healthy}, web: {condition: service_started}}
    restart: unless-stopped
volumes:
  maktaba_pg:
  caddy_data:
  caddy_config:
  maktaba_backups:
